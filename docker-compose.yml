# Optional local backend container. The Vosk model must exist on the host first.
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VOSK_MODEL_PATH: /models/vosk-model-small-en-us-0.15
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - ./backend/models:/models:ro
